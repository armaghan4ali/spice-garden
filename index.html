<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spice Garden | Authentic Desi Cuisine</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;800&family=Poppins:wght@300;400;600&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --gold: #d4a24c; --dark: #14110f; --card: #1f1a17; --cream: #f5ecdf; --wa: #25d366; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { font-family: 'Poppins', sans-serif; background: var(--dark); color: var(--cream); }
  h1, h2, h3 { font-family: 'Playfair Display', serif; }
  body.ur, body.ur h1, body.ur h2, body.ur h3, body.ur button, body.ur input, body.ur select {
    font-family: 'Noto Nastaliq Urdu', serif; line-height: 2; }

  nav { position: fixed; top: 0; width: 100%; display: flex; justify-content: space-between; align-items: center;
        padding: 14px 20px; background: rgba(20,17,15,0.88); backdrop-filter: blur(10px); z-index: 10; }
  .logo { font-family: 'Playfair Display', serif; font-size: 1.3rem; color: var(--gold); font-weight: 800; }
  .links { display: flex; align-items: center; gap: 16px; }
  .links a { color: var(--cream); text-decoration: none; font-size: 0.9rem; }
  #lang-btn { background: var(--gold); color: var(--dark); border: none; padding: 6px 14px;
              border-radius: 20px; font-weight: 600; cursor: pointer; }
  @media (max-width: 560px) { .links a { display: none; } }

  .hero { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center;
          text-align: center; padding: 100px 24px 60px;
          background: radial-gradient(circle at 30% 20%, rgba(212,162,76,0.25), transparent 50%),
                      radial-gradient(circle at 80% 80%, rgba(179,58,31,0.35), transparent 50%), var(--dark); }
  .tag { color: var(--gold); letter-spacing: 3px; font-size: 0.8rem; text-transform: uppercase; margin-bottom: 14px; }
  .hero h1 { font-size: clamp(2.4rem, 9vw, 5rem); line-height: 1.2; margin-bottom: 20px; }
  .hero h1 span { color: var(--gold); font-style: italic; }
  .hero p { max-width: 480px; opacity: 0.8; font-weight: 300; margin-bottom: 32px; }
  .btns { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
  .btn { padding: 14px 30px; border-radius: 40px; text-decoration: none; font-weight: 600; transition: 0.3s; }
  .btn-gold { background: var(--gold); color: var(--dark); }
  .btn-gold:hover { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(212,162,76,0.4); }
  .btn-outline { border: 1px solid var(--gold); color: var(--gold); }

  .stats { display: flex; justify-content: center; gap: 40px; flex-wrap: wrap; padding: 36px 24px;
           border-top: 1px solid rgba(212,162,76,0.2); border-bottom: 1px solid rgba(212,162,76,0.2); }
  .stat { text-align: center; }
  .stat b { display: block; font-family: 'Playfair Display', serif; font-size: 2rem; color: var(--gold); }
  .stat small { opacity: 0.7; }

  section { padding: 80px 20px; max-width: 1000px; margin: auto; }
  .title { text-align: center; margin-bottom: 36px; }
  .title h2 { font-size: 2.3rem; }

  .tabs { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 30px; }
  .tab { background: transparent; border: 1px solid rgba(212,162,76,0.4); color: var(--cream);
         padding: 8px 20px; border-radius: 30px; cursor: pointer; font-family: inherit; transition: 0.3s; }
  .tab.active, .tab:hover { background: var(--gold); color: var(--dark); border-color: var(--gold); }

  .menu { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 20px; }
  .item { background: var(--card); border-radius: 20px; padding: 16px; text-align: center;
          border: 1px solid rgba(212,162,76,0.15); transition: 0.4s; animation: pop 0.5s; }
  .item:hover { transform: translateY(-6px); border-color: var(--gold); }
  .pic { height: 170px; border-radius: 14px; margin-bottom: 14px; display: flex; align-items: center;
         justify-content: center; font-size: 4rem; background: rgba(212,162,76,0.1) center/cover; }
  .item h3 { font-size: 1.25rem; margin-bottom: 4px; }
  .item p { opacity: 0.65; font-size: 0.85rem; margin-bottom: 10px; }
  .price { color: var(--gold); font-weight: 600; font-size: 1.1rem; margin-bottom: 12px; }
  .wa-btn { display: block; background: var(--wa); color: white; text-decoration: none; padding: 10px;
            border-radius: 12px; font-weight: 600; font-size: 0.85rem; }

  .about { display: flex; gap: 30px; align-items: center; flex-wrap: wrap; background: var(--card);
           border-radius: 24px; padding: 36px; }
  .about .big { font-size: 5rem; }
  .about div { flex: 1; min-width: 220px; }
  .about h2 { font-size: 2rem; margin-bottom: 12px; }
  .about p { opacity: 0.75; font-weight: 300; }

  form { background: var(--card); border-radius: 24px; padding: 30px; display: grid;
         grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
  label { font-size: 0.8rem; color: var(--gold); display: block; margin-bottom: 6px; }
  input, select { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid rgba(212,162,76,0.3);
                  background: var(--dark); color: var(--cream); font-family: inherit; font-size: 1rem; }
  form button { grid-column: 1 / -1; background: var(--wa); color: white; border: none; padding: 15px;
                border-radius: 14px; font-size: 1rem; font-weight: 600; cursor: pointer; font-family: inherit; }

  .contact { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px;
             text-align: center; margin-bottom: 20px; }
  .contact div { background: var(--card); padding: 24px; border-radius: 20px; }
  .contact span { font-size: 2rem; display: block; margin-bottom: 8px; }
  iframe { width: 100%; height: 280px; border: 0; border-radius: 20px; filter: grayscale(0.3); }
  footer { text-align: center; padding: 30px; opacity: 0.5; font-size: 0.8rem; }

  .fade { opacity: 0; transform: translateY(40px); transition: 0.8s; }
  .fade.show { opacity: 1; transform: none; }
  @keyframes pop { from { opacity: 0; transform: translateY(15px); } }

  #wa-float { position: fixed; bottom: 22px; left: 22px; width: 56px; height: 56px; border-radius: 50%;
              background: var(--wa); display: flex; align-items: center; justify-content: center;
              font-size: 26px; text-decoration: none; z-index: 20; box-shadow: 0 8px 20px rgba(37,211,102,0.4); }
  #chat-btn { position: fixed; bottom: 22px; right: 22px; width: 62px; height: 62px; border-radius: 50%;
              border: none; background: var(--gold); font-size: 26px; cursor: pointer; z-index: 20;
              box-shadow: 0 8px 25px rgba(212,162,76,0.5); animation: pulse 2s infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 12px rgba(212,162,76,0); } }
  #chat-box { position: fixed; bottom: 96px; right: 22px; width: 330px; max-width: calc(100vw - 44px);
              background: var(--card); border-radius: 20px; overflow: hidden; z-index: 20;
              border: 1px solid rgba(212,162,76,0.3); box-shadow: 0 15px 40px rgba(0,0,0,0.5);
              transform: scale(0); transform-origin: bottom right; transition: 0.3s; }
  #chat-box.open { transform: scale(1); }
  #chat-head { background: linear-gradient(135deg, var(--gold), #b8862f); color: var(--dark); padding: 14px; }
  #chat-head b { display: block; }
  #chat-head small { font-size: 0.75rem; }
  #chat-msgs { height: 300px; overflow-y: auto; padding: 14px; }
  .msg { margin: 8px 0; padding: 10px 14px; border-radius: 16px; max-width: 85%; font-size: 0.85rem; animation: pop 0.3s; }
  .bot { background: #2b2420; }
  .user { background: var(--gold); color: var(--dark); margin-inline-start: auto; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
  .chip { background: transparent; border: 1px solid var(--gold); color: var(--gold); padding: 6px 12px;
          border-radius: 20px; font-size: 0.75rem; cursor: pointer; font-family: inherit; }
  .typing { display: inline-flex; gap: 4px; }
  .typing i { width: 7px; height: 7px; background: var(--gold); border-radius: 50%; animation: bounce 1s infinite; }
  .typing i:nth-child(2) { animation-delay: 0.15s; } .typing i:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce { 50% { transform: translateY(-5px); } }
  #chat-input { display: flex; border-top: 1px solid rgba(212,162,76,0.2); }
  #chat-input input { flex: 1; border: none; border-radius: 0; background: transparent; }
  #chat-input button { background: none; border: none; color: var(--gold); padding: 0 16px; font-size: 1.2rem; cursor: pointer; }
</style>
</head>
<body>

<nav>
  <div class="logo">Spice Garden</div>
  <div class="links">
    <a href="#menu" data-i18n="navMenu"></a>
    <a href="#booking" data-i18n="navBook"></a>
    <a href="#contact" data-i18n="navContact"></a>
    <button id="lang-btn" onclick="setLang(lang === 'en' ? 'ur' : 'en')"></button>
  </div>
</nav>

<div class="hero">

  <div class="btns">

</div>

<div class="stats">

  <div class="stat"><b>40+</b><small data-i18n="s2"></small></div>

</div>

<section id="menu">
  <div class="title fade"><div class="tag" data-i18n="menuTag"></div><h2 data-i18n="menuTitle"></h2></div>
  <div class="tabs" id="tabs"></div>
  <div class="menu" id="menu-grid"></div>
</section>

<section id="about">
  <div class="about fade">
    <div class="big">👨‍🍳</div>
    <div>
      <div class="tag" data-i18n="aboutTag"></div>
      <h2 data-i18n="aboutTitle"></h2>
      <p data-i18n="aboutP"></p>
    </div>
  </div>
</section>

<section id="booking">
  <div class="title fade"><div class="tag" data-i18n="bookTag"></div><h2 data-i18n="bookTitle"></h2></div>
  <form class="fade" onsubmit="book(event)">
    <div><label data-i18n="fName"></label><input name="cname" required></div>
    <div><label data-i18n="fPhone"></label><input name="cphone" type="tel" required></div>
    <div><label data-i18n="fDate"></label><input name="cdate" type="date" required></div>
    <div><label data-i18n="fTime"></label><input name="ctime" type="time" required></div>
    <div><label data-i18n="fGuests"></label>
      <select name="cguests"><option>1</option><option selected>2</option><option>3</option><option>4</option>
        <option>5</option><option>6</option><option>8</option><option>10+</option></select></div>
    <button type="submit" data-i18n="fSubmit"></button>
  </form>
</section>

<section id="contact">
  <div class="title fade"><div class="tag" data-i18n="contactTag"></div><h2 data-i18n="contactTitle"></h2></div>
  <div class="contact">
    <div class="fade"><span>📍</span><p data-i18n="addr"></p></div>
    <div class="fade"><span>📞</span><p>0300-0000000</p></div>
    <div class="fade"><span>🕐</span><p data-i18n="hours"></p></div>
  </div>
  <iframe class="fade" loading="lazy" src="https://maps.google.com/maps?q=Main%20Boulevard%20Lahore&output=embed"></iframe>
</section>

<footer data-i18n="footer"></footer>

<a id="wa-float" href="https://wa.me/923000000000" target="_blank">📱</a>
<button id="chat-btn" onclick="toggleChat()">💬</button>
<div id="chat-box">
  <div id="chat-head"><b data-i18n="chatHead"></b><small data-i18n="chatOnline"></small></div>
  <div id="chat-msgs"></div>
  <div id="chat-input">
    <input id="user-text" data-ph="placeholder" onkeypress="if(event.key==='Enter')send()">
    <button onclick="send()">➤</button>
  </div>
</div>

    { cat: "bbq", en: "Chicken Tikka", ur: "چکن تکہ", den: "Smoky, spiced, grilled", dur: "دھوئیں دار، مصالحے دار", price: 750, emoji: "🍗", img: "" },
    { cat: "rice", en: "Beef Biryani", ur: "بیف بریانی", den: "Fragrant basmati, tender beef", dur: "خوشبودار باسمتی، نرم گوشت", price: 650, emoji: "🍛", img: "" },
    { cat: "rice", en: "Chicken Pulao", ur: "چکن پلاؤ", den: "Light, aromatic, comforting", dur: "ہلکا اور خوشبودار", price: 550, emoji: "🍚", img: "" },
    { cat: "bread", en: "Garlic Naan", ur: "گارلک نان", den: "Fresh from the clay tandoor", dur: "تندور سے تازہ", price: 120, emoji: "🫓", img: "" },

  const cats = [["all", "All", "سب"], ["karahi", "Karahi", "کڑاہی"], ["bbq", "BBQ", "باربی کیو"], ["rice", "Rice", "چاول"], ["bread", "Bread", "روٹی"]];

  const T = {
    en: { navMenu: "Menu", navBook: "Booking", navContact: "Contact", tag1: "✦ Since 2015 ✦",
      heroTitle: "Taste the <span>Soul</span><br>of Desi Cuisine",
      heroP: "Slow-cooked recipes, fresh spices, and the warmth of home in every bite.",
      btnMenu: "View Menu", btnBook: "Book a Table", s1: "Years of Taste", s2: "Signature Dishes", s3: "Free Delivery",
      menuTag: "Our Specials", menuTitle: "Signature Menu", aboutTag: "Our Story", aboutTitle: "Family Recipes, Passed Down",
      aboutP: "What started as a small family kitchen is now home to food lovers across the city. Every dish is made fresh each morning using spices we grind ourselves.",
      bookTag: "Reservations", bookTitle: "Book Your Table", fName: "Your Name", fPhone: "Phone Number",
      fDate: "Date", fTime: "Time", fGuests: "Guests", fSubmit: "📅 Book via WhatsApp",
      contactTag: "Visit Us", contactTitle: "Find Us", addr: "Main Boulevard, Lahore", hours: "12 PM – 12 AM, Daily",
      footer: "© Spice Garden · Sample website", order: "Order on WhatsApp",
      chatHead: "Spice Garden Assistant", chatOnline: "● Online, replies instantly", placeholder: "Type a message...",
      welcome: "Hi! 👋 Welcome to Spice Garden. What would you like to know?",
      fallback: "Sorry, I didn't catch that. Message us on WhatsApp and our team will help! 😊" },
    ur: { navMenu: "مینو", navBook: "بکنگ", navContact: "رابطہ", tag1: "✦ 2015 سے ✦",
      heroTitle: "دیسی کھانوں کی <span>اصل</span><br>روح کا ذائقہ",
      heroP: "دم پخت ترکیبیں، تازہ مصالحے، اور ہر نوالے میں گھر کا ذائقہ۔",
      btnMenu: "مینو دیکھیں", btnBook: "ٹیبل بک کریں", s1: "سال کا ذائقہ", s2: "خاص پکوان", s3: "مفت ڈیلیوری",
      menuTag: "ہمارے خاص", menuTitle: "سگنیچر مینو", aboutTag: "ہماری کہانی", aboutTitle: "خاندانی ترکیبیں، نسل در نسل",
      aboutP: "ایک چھوٹے سے خاندانی کچن سے شروع ہونے والا سفر آج شہر بھر کے کھانے کے شوقینوں کا گھر ہے۔ ہر ڈش روزانہ صبح تازہ بنتی ہے۔",
      bookTag: "ریزرویشن", bookTitle: "اپنی ٹیبل بک کریں", fName: "آپ کا نام", fPhone: "فون نمبر",
      fDate: "تاریخ", fTime: "وقت", fGuests: "مہمان", fSubmit: "📅 واٹس ایپ پر بک کریں",
      contactTag: "ہم سے ملیں", contactTitle: "ہمارا پتہ", addr: "مین بلیوارڈ، لاہور", hours: "دوپہر 12 سے رات 12، روزانہ",
      footer: "© اسپائس گارڈن · نمونہ ویب سائٹ", order: "واٹس ایپ پر آرڈر",
      chatHead: "اسپائس گارڈن اسسٹنٹ", chatOnline: "● آن لائن", placeholder: "پیغام لکھیں...",
      welcome: "اسپائس گارڈن میں خوش آمدید! 👋 آپ کیا جاننا چاہیں گے؟",
      fallback: "معذرت، میں سمجھ نہیں سکا۔ واٹس ایپ پر ہم سے رابطہ کریں 😊" }
  };

  const answers = [
    { keys: ["menu", "food", "khana", "مینو", "کھانا"], en: "Our specials: Karahi, BBQ, Biryani and fresh Naan 🍛 Check the full menu above!", ur: "ہمارے خاص پکوان: کڑاہی، باربی کیو، بریانی اور تازہ نان 🍛 اوپر مکمل مینو دیکھیں!" },
    { keys: ["price", "rate", "kitna", "قیمت"], en: "Biryani Rs 650, Seekh Kebab Rs 900, Chicken Karahi Rs 1,800. All prices are in the menu.", ur: "بریانی 650 روپے، سیخ کباب 900، چکن کڑاہی 1,800 روپے۔ مکمل قیمتیں مینو میں ہیں۔" },
    { keys: ["time", "timing", "open", "hours", "اوقات", "وقت"], en: "We're open every day, 12 PM to 12 AM 🕐", ur: "ہم روزانہ دوپہر 12 سے رات 12 بجے تک کھلے ہیں 🕐" },
    { keys: ["deliver", "delivery", "ڈیلیوری"], en: "Yes! Free delivery within 5 km 🛵 Tap 'Order on WhatsApp' on any dish.", ur: "جی ہاں! 5 کلومیٹر تک مفت ڈیلیوری 🛵 کسی بھی ڈش پر واٹس ایپ آرڈر دبائیں۔" },
    { keys: ["location", "address", "where", "kahan", "پتہ", "کہاں"], en: "📍 Main Boulevard, Lahore. The map is at the bottom of the page!", ur: "📍 مین بلیوارڈ، لاہور۔ نقشہ صفحے کے آخر میں ہے!" },
    { keys: ["book", "table", "reserve", "بکنگ", "ٹیبل"], en: "Fill in the booking form below, and your request goes straight to our WhatsApp 📅", ur: "نیچے بکنگ فارم بھریں، آپ کی بکنگ سیدھی واٹس ایپ پر آ جائے گی 📅" },
    { keys: ["salam", "hello", "hi", "سلام"], en: "Wa Alaikum Assalam! 👋 How can I help you today?", ur: "وعلیکم السلام! 👋 میں آپ کی کیا مدد کر سکتا ہوں؟" }
  ];
  const quick = { en: ["Menu", "Timing", "Delivery", "Book a table"], ur: ["مینو", "اوقات", "ڈیلیوری", "بکنگ"] };

  let lang = "en", cat = "all";
  const msgs = document.getElementById("chat-msgs");

  function setLang(l) {
    lang = l;
    document.documentElement.lang = l;
    document.documentElement.dir = l === "ur" ? "rtl" : "ltr";
    document.body.classList.toggle("ur", l === "ur");
    document.querySelectorAll("[data-i18n]").forEach(el => el.innerHTML = T[l][el.dataset.i18n]);
    document.querySelectorAll("[data-ph]").forEach(el => el.placeholder = T[l][el.dataset.ph]);
    document.getElementById("lang-btn").textContent = l === "en" ? "اردو" : "English";
    renderTabs(); renderMenu();
    msgs.innerHTML = "";
    if (document.getElementById("chat-box").classList.contains("open")) greet();
  }

  function renderTabs() {
    document.getElementById("tabs").innerHTML = cats.map(c =>
      `<button class="tab ${c[0] === cat ? "active" : ""}" onclick="filterMenu('${c[0]}')">${lang === "en" ? c[1] : c[2]}</button>`).join("");
  }
  function filterMenu(c) { cat = c; renderTabs(); renderMenu(); }

  function renderMenu() {
    document.getElementById("menu-grid").innerHTML = menu
      .filter(m => cat === "all" || m.cat === cat)
      .map(m => {
        const pic = m.img ? `<div class="pic" style="background-image:url('${m.img}')"></div>` : `<div class="pic">${m.emoji}</div>`;
        const text = encodeURIComponent(`Hi! I'd like to order: ${m.en} (Rs ${m.price})`);
        return `<div class="item">${pic}<h3>${m[lang]}</h3><p>${lang === "en" ? m.den : m.dur}</p>
          <div class="price">Rs ${m.price.toLocaleString()}</div>
          <a class="wa-btn" target="_blank" href="https://wa.me/${WA}?text=${text}">💬 ${T[lang].order}</a></div>`;
      }).join("");
  }

  function book(e) {
    e.preventDefault();
    const f = e.target.elements;
    const msg = `Table Booking Request\nName: ${f.cname.value}\nPhone: ${f.cphone.value}\nDate: ${f.cdate.value}\nTime: ${f.ctime.value}\nGuests: ${f.cguests.value}`;
    location.href = `https://wa.me/${WA}?text=${encodeURIComponent(msg)}`;
  }

  function toggleChat() {
    document.getElementById("chat-box").classList.toggle("open");
    if (!msgs.innerHTML) greet();
  }
  function greet() { addMsg(T[lang].welcome, "bot"); showChips(); }
  function addMsg(text, who) {
    const d = document.createElement("div");
    d.className = "msg " + who; d.textContent = text;
    msgs.appendChild(d); msgs.scrollTop = msgs.scrollHeight;
  }
  function showChips() {
    const c = document.createElement("div"); c.className = "chips";
    quick[lang].forEach(q => {
      const b = document.createElement("button");
      b.className = "chip"; b.textContent = q; b.onclick = () => reply(q);
      c.appendChild(b);
    });
    msgs.appendChild(c); msgs.scrollTop = msgs.scrollHeight;
  }
  function reply(text) {
    addMsg(text, "user");
    const t = document.createElement("div");
    t.className = "msg bot"; t.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
    msgs.appendChild(t); msgs.scrollTop = msgs.scrollHeight;
    const lower = text.toLowerCase();
    const m = answers.find(a => a.keys.some(k => lower.includes(k)));
    setTimeout(() => { t.remove(); addMsg(m ? m[lang] : T[lang].fallback, "bot"); showChips(); }, 900);
  }
  function send() {
    const input = document.getElementById("user-text");
    const text = input.value.trim();
    if (!text) return;
    input.value = ""; reply(text);
  }

  const obs = new IntersectionObserver(entries => entries.forEach(e => {
    if (e.isIntersecting) e.target.classList.add("show");
  }), { threshold: 0.15 });
  document.querySelectorAll(".fade").forEach(el => obs.observe(el));

  setLang("en");
</script>
</body>
</html>
